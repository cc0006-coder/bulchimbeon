name: "🤖 새 에이전트 감지 요청 / New agent request"
description: "목록에 없는 AI 에이전트도 감지해 주세요 / Please detect another AI agent"
title: "[에이전트 요청] "
labels: ["agent-request"]
body:
  - type: markdown
    attributes:
      value: |
        기다리기 어렵다면 지금 바로 직접 추가할 수도 있습니다 / You can add it yourself right now:
        `defaults write io.github.s3onghyun.bulchimbeon customAgents -array <name>`
  - type: input
    id: agent
    attributes:
      label: "에이전트 이름·링크 / Agent name & link"
      placeholder: "Goose — https://github.com/block/goose"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: "설치 방식 / How is it installed?"
      multiple: true
      options:
        - "네이티브 바이너리 / Native binary"
        - "Homebrew"
        - "npm / npx"
        - "bun / deno"
        - "pip / uv"
        - "IDE 확장 내장 / Bundled in an IDE extension"
        - "기타 / Other"
    validations:
      required: true
  - type: textarea
    id: process
    attributes:
      label: "실행 중 프로세스 모습 / How the process looks while running"
      description: |
        에이전트를 실행한 상태에서 / While the agent is running:
        `ps -Axo comm=,args= | grep -i <name>`
        ⚠️ API 키 같은 인자가 보이면 꼭 지워주세요. / Remove any secrets (API keys) from arguments!
      render: text
    validations:
      required: true
