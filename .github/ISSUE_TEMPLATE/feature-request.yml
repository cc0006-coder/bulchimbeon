name: "💡 Feature request / 기능 제안"
description: "Ideas for features, the soldier's lines, sprites or skins / 기능·대사·스프라이트·스킨 아이디어"
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! 🫡 Please check [open issues](https://github.com/s3onghyun/bulchimbeon/issues) first so we don't duplicate it.
        아이디어 감사합니다! 비슷한 이슈가 이미 있는지 먼저 확인해주세요.

        Bulchimbeon makes no network calls and has no third-party dependencies; ideas need to fit within that.
        불침번은 네트워크 통신과 서드파티 의존성이 없습니다. 이 원칙 안에서 가능한 아이디어여야 합니다.
  - type: dropdown
    id: kind
    attributes:
      label: "What kind of idea? / 어떤 종류인가요?"
      options:
        - "Feature / 기능"
        - "Soldier's line / 대사"
        - "Sprite or skin / 스프라이트·스킨"
        - "Other / 기타"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What problem does it solve? / 어떤 불편을 해결하나요?"
      placeholder: "e.g. I want to know how long the last watch lasted / 예) 지난 근무가 얼마나 이어졌는지 알고 싶다"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Your proposal / 제안"
      description: |
        For a line, write it in English and/or Korean. Tone: earnest and cute, no hazing jokes.
        대사라면 영어·한국어 중 편한 쪽으로 적어주세요. 톤은 성실하고 귀엽게, 갈굼 개그는 없이.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives or workarounds you've tried / 생각해 본 다른 방법"
  - type: checkboxes
    id: pr
    attributes:
      label: "Contribution / 기여"
      options:
        - label: "I'd like to send a PR for this / 직접 PR 을 보내고 싶습니다"
