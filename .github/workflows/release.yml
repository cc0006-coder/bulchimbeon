name: Release

# v* 태그 푸시 → universal 빌드 → 빌드 출처 증명(attestation) → GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write      # Release 생성
      id-token: write      # attestation 서명 (Sigstore OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Verify
        run: |
          codesign --verify --strict --verbose=2 dist/Bulchimbeon.app
          lipo -archs dist/Bulchimbeon.app/Contents/MacOS/Bulchimbeon
          cd dist && shasum -a 256 -c ./*.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "불침번 $GITHUB_REF_NAME" --generate-notes --verify-tag
