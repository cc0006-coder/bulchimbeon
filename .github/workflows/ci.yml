name: CI

on:
  push:
    branches: [main]
  pull_request:

# 최소 권한: 코드 읽기만
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # 서드파티 Action 은 태그가 아닌 커밋 SHA 로 고정 (태그 변조 대비)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --strict --verbose=2 dist/Bulchimbeon.app
